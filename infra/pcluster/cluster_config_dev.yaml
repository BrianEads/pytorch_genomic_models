Region: us-east-1
Image:
  Os: alinux2
  CustomAmi: !Sub "{{resolve:ssm:/bayer/pytorch-genomic/ami/gpu-training-latest}}"

HeadNode:
  InstanceType: m5.large
  Networking:
    SubnetId: !Sub "{{resolve:ssm:/bayer/platform/networking/private_subnet_ids_az_a}}"
  Ssh:
    KeyName: !Ref KeyPairName
  CustomActions:
    OnNodeStart:
      Script: custom_actions/on_node_start.sh
      Sequence: 1
    OnNodeConfigured:
      Script: custom_actions/on_node_configured.sh
      Sequence: 2

Scheduling:
  Scheduler: slurm
  SlurmQueues:
    - Name: dev
      CapacityType: ONDEMAND
      Networking:
        SubnetIds:
          - !Sub "{{resolve:ssm:/bayer/platform/networking/private_subnet_ids_az_a}}"
      ComputeResources:
        - Name: g4dn-xlarge
          InstanceType: g4dn.xlarge
          MinCount: 0
          MaxCount: 1

SharedStorage:
  - Name: efs-data
    StorageType: Efs
    MountDir: /mnt/efs
    EfsSettings:
      FileSystemId: !Sub "{{resolve:ssm:/bayer/pytorch-genomic/efs/filesystem_id}}"

# Environment variables injected into custom action scripts
# S3 bucket lives in the DFW dev/testing AWS account (data-fetch-wizard staging)
Environment:
  EFS_DNS: !Ref EfsDns
  S3_DATASET_BUCKET: !Ref S3DatasetBucket
  S3_RAW_PREFIX: !Ref S3RawPrefix
  S3_TOKENISED_PREFIX: !Ref S3TokenisedPrefix
  S3_MANIFESTS_PREFIX: !Ref S3ManifestsPrefix

Parameters:
  KeyPairName:
    Type: String
    Default: ""
  EfsDns:
    Type: String
    Default: ""
  S3DatasetBucket:
    Type: String
    Default: cs-cp-bifx-dfw-pytorch-genomic-data
  S3RawPrefix:
    Type: String
    Default: raw/
  S3TokenisedPrefix:
    Type: String
    Default: tokenised/
  S3ManifestsPrefix:
    Type: String
    Default: manifests/
