tower: scrna_transformer
d_model: 256
n_layers: 6
n_heads: 8
vocab_size: 20000
max_genes: 2048
batch_size: 64
learning_rate: 1.0e-4
epochs: 30
objective: masked_gene_expression
mask_fraction: 0.15
manifest_path: data/manifests/dmel_foundation_manifest.json
required_modalities:
  - rnaseq
strict: false
tissue_filter: midgut
output_dir: checkpoints/rnaseq_midgut_pretrain
